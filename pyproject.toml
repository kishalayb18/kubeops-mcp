[project]
name = "kubeops-mcp"
version = "0.1.0"
description = "MCP server for reviewable Kubernetes changes in GitHub repositories"
readme = "README.md"
authors = [
    { name = "Kishalay Bhattacharya", email = "bhattacharyakishalay@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.13.0,<2.0.0",
    "pyyaml>=6.0.2,<7.0.0",
]

[project.scripts]
kubeops-mcp = "kubeops_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0,<9.0.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
